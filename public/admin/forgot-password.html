<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Password Recovery - IT Service Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #0b0f19;
      --bg-surface: #111827;
      --border-subtle: #1e293b;
      --border-focus: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --radius-sm: 6px;
      --radius-lg: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Prompt', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .ambient-glow {
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 350px;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .auth-card {
      width: 440px;
      max-width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }
    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
    }
    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .brand-tag {
      font-size: 11px;
      font-weight: 600;
      color: #a5b4fc;
      background: rgba(79, 70, 229, 0.15);
      border: 1px solid rgba(79, 70, 229, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .section-intro {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-input {
      background: var(--bg-body);
      border: 1px solid var(--border-subtle);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s ease;
    }
    .form-input:focus {
      border-color: var(--border-focus);
    }

    .btn-submit {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 11px 16px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease;
      margin-top: 4px;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .auth-footer {
      border-top: 1px solid var(--border-subtle);
      padding-top: 16px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 12px;
      color: var(--text-subtle);
      text-align: center;
    }
    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }
    .auth-footer a:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 10px 18px;
      background: #10b981;
      color: white;
      font-weight: 500;
      font-size: 13px;
      border-radius: var(--radius-sm);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      z-index: 9999;
      display: none;
    }
    .toast.error {
      background: #ef4444;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-icon">🛠️</div>
      <div class="brand-title">IT Service Desk</div>
      <div class="brand-tag">👑 Admin Recovery</div>
    </div>

    <!-- Step 1: Request Reset Token -->
    <div id="stepRequestBox">
      <div class="section-intro" style="margin-bottom: 14px;">
        กรอกอีเมลผู้ดูแลเพื่อขอรับรหัสรีเซ็ตรหัสผ่าน
      </div>

      <form id="requestForm" onsubmit="handleRequestToken(event)" style="display: flex; flex-direction: column; gap: 14px;">
        <div class="form-group">
          <label for="inpAdminEmail">อีเมลผู้ดูแล (Admin Email) *</label>
          <input type="email" class="form-input" id="inpAdminEmail" value="admin@example.com" placeholder="admin@example.com" required autofocus>
        </div>

        <button type="submit" class="btn-submit" id="btnRequest">
          <span>ขอรหัสรีเซ็ตรหัสผ่าน 🔑</span>
        </button>
      </form>
    </div>

    <!-- Step 2: Reset Password with Token -->
    <div id="stepResetBox" style="display: none;">
      <div class="section-intro" style="margin-bottom: 14px;">
        กรอก Reset Token และกำหนดรหัสผ่านใหม่
      </div>

      <form id="resetForm" onsubmit="handleResetPassword(event)" style="display: flex; flex-direction: column; gap: 14px;">
        <div class="form-group">
          <label for="inpResetToken">Reset Password Token *</label>
          <input type="text" class="form-input" id="inpResetToken" placeholder="รหัสโทเค็นที่ได้รับ" required style="font-family: 'JetBrains Mono', monospace;">
        </div>

        <div class="form-group">
          <label for="inpNewPassword">รหัสผ่านใหม่ (New Password) *</label>
          <input type="password" class="form-input" id="inpNewPassword" placeholder="อย่างน้อย 6 ตัวอักษร" required>
        </div>

        <button type="submit" class="btn-submit" id="btnReset">
          <span>ยืนยันตั้งรหัสผ่านใหม่ ✅</span>
        </button>
      </form>
    </div>

    <div class="auth-footer">
      <div>
        <a href="/admin/login">← กลับไปหน้าเข้าสู่ระบบ Admin</a>
      </div>
      <div>
        สำหรับพนักงานทั่วไป <a href="/login">ไปที่หน้า User Portal ↗</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg">ส่งข้อมูลสำเร็จ</div>

  <script>
    const API_BASE = window.location.origin;

    function showToast(msg, isError = false) {
      const t = document.getElementById('toastMsg');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error' : '');
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2800);
    }

    async function handleRequestToken(e) {
      e.preventDefault();
      const email = document.getElementById('inpAdminEmail').value.trim();
      const btn = document.getElementById('btnRequest');

      btn.disabled = true;
      btn.textContent = 'กำลังขอรหัส...';

      try {
        const res = await fetch(`${API_BASE}/admin/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'ไม่พบอีเมลผู้ดูแลนี้ในระบบ');

        showToast('สร้าง Reset Token สำเร็จ! ระบบกรอกให้อัตโนมัติแล้ว');
        document.getElementById('stepRequestBox').style.display = 'none';
        document.getElementById('stepResetBox').style.display = 'block';
        if (data.resetPasswordToken) {
          document.getElementById('inpResetToken').value = data.resetPasswordToken;
        }
      } catch (err) {
        showToast(err.message, true);
        btn.disabled = false;
        btn.innerHTML = '<span>ขอรหัสรีเซ็ตรหัสผ่าน 🔑</span>';
      }
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const resetPasswordToken = document.getElementById('inpResetToken').value.trim();
      const password = document.getElementById('inpNewPassword').value;
      const btn = document.getElementById('btnReset');

      btn.disabled = true;
      btn.textContent = 'กำลังบันทึก...';

      try {
        const res = await fetch(`${API_BASE}/admin/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resetPasswordToken, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'โทเค็นไม่ถูกต้องหรือหมดอายุ');

        showToast('รีเซ็ตรหัสผ่านผู้ดูแลเรียบร้อย! กำลังนำไปหน้า Login...');
        setTimeout(() => {
          window.location.href = '/admin/login';
        }, 1200);
      } catch (err) {
        showToast(err.message, true);
        btn.disabled = false;
        btn.innerHTML = '<span>ยืนยันตั้งรหัสผ่านใหม่ ✅</span>';
      }
    }
  </script>
</body>
</html>
