<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - IT Service Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #0b0f19;
      --bg-surface: #111827;
      --bg-surface-elevated: #161f33;
      --border-subtle: #1e293b;
      --border-focus: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .ambient-glow {
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 350px;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .auth-card {
      width: 440px;
      max-width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }
    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
    }
    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }
    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #a5b4fc;
      background: rgba(79, 70, 229, 0.15);
      border: 1px solid rgba(79, 70, 229, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .section-intro {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-input {
      background: var(--bg-body);
      border: 1px solid var(--border-subtle);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s ease;
    }
    .form-input:focus {
      border-color: var(--border-focus);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }
    .form-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .form-options a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
    }
    .form-options a:hover {
      text-decoration: underline;
    }

    .btn-submit {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 11px 16px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease;
      margin-top: 4px;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
    }


    .auth-footer {
      border-top: 1px solid var(--border-subtle);
      padding-top: 16px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 12px;
      color: var(--text-subtle);
      text-align: center;
    }
    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }
    .auth-footer a:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 10px 18px;
      background: #10b981;
      color: white;
      font-weight: 500;
      font-size: 13px;
      border-radius: var(--radius-sm);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      z-index: 9999;
      display: none;
    }
    .toast.error {
      background: #ef4444;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-icon">🛠️</div>
      <div class="brand-title">IT Service Desk</div>
      <div class="brand-tag">👑 Admin Console</div>
    </div>

    <div class="section-intro">
      เข้าสู่ระบบสำหรับผู้ดูแลระบบ (Admin & Technical Operations)
    </div>

    <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" style="display: flex; flex-direction: column; gap: 14px;">
      <div class="form-group">
        <label for="inpAdminEmail">อีเมลผู้ดูแล (Admin Email) *</label>
        <input type="email" class="form-input" id="inpAdminEmail" placeholder="เช่น admin@domain.com" required autofocus autocomplete="email">
      </div>

      <div class="form-group">
        <label for="inpAdminPassword">รหัสผ่าน (Password) *</label>
        <input type="password" class="form-input" id="inpAdminPassword" placeholder="กรอกรหัสผ่าน" required autocomplete="current-password">
      </div>

      <div class="form-options">
        <label>
          <input type="checkbox" id="chkRememberMe" style="accent-color: var(--primary);"> จดจำฉันไว้ (Remember Me)
        </label>
        <a href="/admin/forgot-password">ลืมรหัสผ่าน?</a>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span>เข้าสู่ระบบ Admin 👑</span>
      </button>
    </form>

    <div class="auth-footer">
      <div>
        ยังไม่ได้ตั้งค่า Super Admin? <a href="/admin/register">ลงทะเบียนผู้ดูแลคนแรก</a>
      </div>
      <div>
        สำหรับพนักงานทั่วไป <a href="/login">ไปที่หน้า User Portal ↗</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toastMsg">เข้าสู่ระบบสำเร็จ</div>

  <script>
    const API_BASE = window.location.origin;

    function showToast(msg, isError = false) {
      const t = document.getElementById('toastMsg');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error' : '');
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2800);
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('inpAdminEmail').value.trim();
      const password = document.getElementById('inpAdminPassword').value;
      const rememberMe = document.getElementById('chkRememberMe').checked;
      const btn = document.getElementById('btnSubmit');

      if (!email || !password) {
        return showToast('กรุณากรอกอีเมลและรหัสผ่าน', true);
      }

      btn.disabled = true;
      btn.textContent = 'กำลังตรวจสอบ...';

      try {
        const res = await fetch(`${API_BASE}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, rememberMe })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || 'อีเมลหรือรหัสผ่านผู้ดูแลไม่ถูกต้อง');
        }

        const token = data.data?.token || data.token;
        const user = data.data?.user || data.user || { email, role: 'ADMIN' };

        localStorage.setItem('auth_token', token);
        localStorage.setItem('auth_user', JSON.stringify(user));

        showToast('เข้าสู่ระบบ Admin สำเร็จ กำลังเข้าสู่แดชบอร์ด...');
        setTimeout(() => {
          window.location.href = '/admin';
        }, 600);
      } catch (err) {
        showToast(err.message, true);
        btn.disabled = false;
        btn.innerHTML = '<span>เข้าสู่ระบบ Admin 👑</span>';
      }
    }
  </script>
</body>
</html>
